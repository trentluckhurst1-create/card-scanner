[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "card-scanner"
version = "0.1.0"
description = "Sports card marketplace mispricing scanner"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "typer>=0.12"
]

[project.scripts]
card-scanner = "card_scanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
