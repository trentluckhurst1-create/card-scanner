name: publish-nfl-inventory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_nfl_inventory.py'
      - 'scripts/audit_nfl_identity_readiness.py'
      - 'scripts/audit_nfl_promotion_candidates.py'
      - '.github/workflows/publish-nfl-inventory.yml'
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-inventory-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Crawl deep NFL singles inventory in staging
        run: python scripts/publish_nfl_inventory.py --limit-per-store 2500 --ebay-retain-cycles 3 --output docs/nfl_inventory.json
      - name: Enrich staged NFL inventory with targeted eBay Browse inventory
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_AU
        run: python scripts/enrich_active_market_ebay.py --feed docs/nfl_inventory.json --max-targets 1000 --results-per-target 75
      - name: Audit staged NFL identity readiness
        run: python scripts/audit_nfl_identity_readiness.py --feed docs/nfl_inventory.json --output artifacts/nfl_identity_readiness_audit.json
      - name: Audit exact NFL promotion candidates
        run: python scripts/audit_nfl_promotion_candidates.py --staging docs/nfl_inventory.json --production docs/comparison.json --output artifacts/nfl_promotion_candidates.json
      - name: Upload NFL staging audits
        uses: actions/upload-artifact@v4
        with:
          name: nfl-staging-audits
          path: |
            artifacts/nfl_identity_readiness_audit.json
            artifacts/nfl_promotion_candidates.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish staged NFL inventory snapshot
        run: |
          if [ -z "$(git status --porcelain -- docs/nfl_inventory.json)" ]; then
            echo "NFL_INVENTORY_CHANGED=NO"
          else
            git config user.name "card-scanner-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs/nfl_inventory.json
            git commit -m "data: refresh staged NFL inventory"
            git push origin HEAD:main
            echo "NFL_INVENTORY_CHANGED=YES"
          fi
