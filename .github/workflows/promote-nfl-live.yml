name: promote-nfl-live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-nfl-live.yml'
      - 'scripts/promote_nfl_exact_comparisons.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nfl-live-promotion
  cancel-in-progress: true

jobs:
  promote:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Promote existing staged NFL exact groups immediately
        run: python scripts/promote_nfl_exact_comparisons.py --staging docs/nfl_inventory.json --production docs/comparison.json --output docs/comparison.json
      - name: Commit promoted comparison feed
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- docs/comparison.json)" ]; then
            git add -- docs/comparison.json
            git commit -m "data: promote staged NFL exact comparisons live"
            git push origin HEAD:main
          fi
      - name: Make exact comparison board the default landing page
        run: cp docs/live-compare.html docs/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload live dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy live dashboard
        id: deployment
        uses: actions/deploy-pages@v4
