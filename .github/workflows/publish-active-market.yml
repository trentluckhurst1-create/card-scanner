name: publish-active-market

on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_active_market.py'
      - 'scripts/enrich_active_market_ebay.py'
      - 'scripts/publish_exact_comparisons.py'
      - 'scripts/audit_live_comparisons.py'
      - 'scripts/audit_identity_completeness.py'
      - 'scripts/audit_cross_store_overlap.py'
      - 'scripts/audit_visual_exactness.py'
      - 'src/card_scanner/sources/**'
      - 'src/card_scanner/identity.py'
      - 'src/card_scanner/identity_match.py'
      - 'src/card_scanner/exact_discovery.py'
      - 'src/card_scanner/dashboard_export.py'
      - 'src/card_scanner/active_price_comparison.py'
      - 'src/card_scanner/visual_identity.py'
      - 'pyproject.toml'
      - '.github/workflows/publish-active-market.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: active-market-publisher
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Fetch public active-store catalogue and compare prices
        run: >-
          python scripts/publish_active_market.py
          --limit-per-store-per-sport 1000
          --deep-overlap-targets 250
          --deep-results-per-store 300
          --exact-discovery-targets 700
          --exact-results-per-store 400
          --output docs/active_market.json
      - name: Enrich active catalogue with targeted eBay Browse inventory
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_AU
        run: python scripts/enrich_active_market_ebay.py --feed docs/active_market.json --max-targets 500 --results-per-target 100
      - name: Publish exact-card-only comparison feed
        run: python scripts/publish_exact_comparisons.py --feed docs/active_market.json --output docs/comparison.json
      - name: Audit live active-price comparisons
        run: python scripts/audit_live_comparisons.py --feed docs/active_market.json --output artifacts/live_active_comparison_audit.json
      - name: Audit identity completeness
        run: python scripts/audit_identity_completeness.py --feed docs/active_market.json --output artifacts/identity_completeness_audit.json
      - name: Audit cross-store overlap
        run: python scripts/audit_cross_store_overlap.py --feed docs/active_market.json --output artifacts/cross_store_overlap_audit.json
      - name: Audit exact-card listing photos
        run: python scripts/audit_visual_exactness.py --feed docs/comparison.json --output artifacts/visual_exactness_audit.json
      - name: Upload refresh audits
        uses: actions/upload-artifact@v4
        with:
          name: active-market-refresh-audits
          path: |
            artifacts/live_active_comparison_audit.json
            artifacts/identity_completeness_audit.json
            artifacts/cross_store_overlap_audit.json
            artifacts/visual_exactness_audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish active comparison snapshot
        run: |
          if [ -z "$(git status --porcelain -- docs/active_market.json docs/comparison.json)" ]; then
            echo "ACTIVE_MARKET_CHANGED=NO"
          else
            git config user.name "card-scanner-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs/active_market.json docs/comparison.json
            git commit -m "data: refresh active market and exact comparison feeds"
            git push origin HEAD:main
            echo "ACTIVE_MARKET_CHANGED=YES"
          fi
      - name: Make exact comparison board the default landing page
        run: cp docs/live-compare.html docs/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload live dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy live dashboard
        id: deployment
        uses: actions/deploy-pages@v4
