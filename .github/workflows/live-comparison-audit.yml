name: live-comparison-audit

on:
  push:
    branches: [main]
    paths:
      - 'docs/market.json'
      - 'src/card_scanner/active_price_comparison.py'
      - 'src/card_scanner/dashboard_export.py'
      - 'src/card_scanner/identity_match.py'
      - 'scripts/audit_live_comparisons.py'
      - '.github/workflows/live-comparison-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Audit checked-in live feed
        run: python scripts/audit_live_comparisons.py
      - name: Upload comparison audit
        uses: actions/upload-artifact@v4
        with:
          name: live-comparison-audit
          path: artifacts/live_comparison_audit.json
          if-no-files-found: error
          retention-days: 30
