name: identity-completeness-audit

on:
  push:
    branches: [main]
    paths:
      - 'docs/active_market.json'
      - 'scripts/audit_identity_completeness.py'
      - '.github/workflows/identity-completeness-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Audit active-market identity completeness
        run: python scripts/audit_identity_completeness.py --feed docs/active_market.json --output artifacts/identity_completeness_audit.json
      - name: Upload identity completeness audit
        uses: actions/upload-artifact@v4
        with:
          name: identity-completeness-audit
          path: artifacts/identity_completeness_audit.json
          if-no-files-found: error
          retention-days: 30
